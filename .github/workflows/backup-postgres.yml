name: Daily Encrypted PostgreSQL Backup

on:
  schedule:
    # Run daily at 02:30 UTC (09:30 Asia/Ho_Chi_Minh)
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check backup secrets
        id: check_secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping backup: DATABASE_URL or BACKUP_ENCRYPTION_KEY secret is not configured."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install PostgreSQL 16 client
        if: steps.check_secrets.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 openssl

      - name: Dump and encrypt database
        if: steps.check_secrets.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          STAMP=$(date -u +%Y%m%d_%H%M%S)
          DUMP_FILE="hoantiensan_${STAMP}.sql.gz"
          ENC_FILE="${DUMP_FILE}.enc"
          pg_dump "$DATABASE_URL" --no-owner --no-acl --format=plain | gzip -9 > "$DUMP_FILE"
          openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -salt -in "$DUMP_FILE" -out "$ENC_FILE" -pass env:BACKUP_ENCRYPTION_KEY
          rm -f "$DUMP_FILE"
          echo "ENC_FILE=$ENC_FILE" >> "$GITHUB_ENV"

      - name: Upload encrypted backup artifact (30-day retention)
        if: steps.check_secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pg-backup-${{ github.run_id }}
          path: ${{ env.ENC_FILE }}
          retention-days: 30
