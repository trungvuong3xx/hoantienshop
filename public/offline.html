<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <meta name="theme-color" content="#ee4d2d" />
  <title>Mất kết nối mạng - LiLa</title>
  <style>
    :root {
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #64748b;
      --primary: #0068ff;
      --primary-hover: #0056d6;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
    }
    .brand-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 24px;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: inline-block;
    }
    .offline-icon-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 20px auto;
      background: #fff1ed;
      border: 1px solid #fed7aa;
      color: #ee4d2d;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 12px;
    }
    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-sub);
      margin-bottom: 28px;
    }
    .btn-retry {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      outline-offset: 2px;
    }
    .btn-retry:hover {
      background: var(--primary-hover);
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .btn-retry:focus-visible {
      outline: 2px solid #0068ff;
    }
    .footer-hint {
      margin-top: 20px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
  </style>
</head>
<body data-reason="connection">
  <main class="offline-card" role="main">
    <div class="brand-title">
      <img src="/icon.svg" alt="LiLa" class="brand-icon" width="28" height="28" />
      <span>LiLa</span>
    </div>
    <div class="offline-icon-wrap" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1 id="connectionTitle">Không thể kết nối</h1>
    <p id="connectionMessage" role="status">
      Không thể kết nối đến máy chủ. Vui lòng kiểm tra lại kết nối Wi-Fi hoặc dữ liệu di động (4G/5G) trên thiết bị của bạn rồi thử lại.
    </p>
    <button type="button" class="btn-retry" id="retryConnection" onclick="window.location.reload()">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      <span>Thử kết nối lại</span>
    </button>
    <div class="footer-hint">Nếu vẫn gặp lỗi, hãy thử lại sau vài phút. Không cần xóa ứng dụng hoặc đăng ký lại tài khoản.</div>
  </main>
  <script src="/offline.js" defer></script>
</body>
</html>
