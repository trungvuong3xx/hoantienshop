<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="htsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EE4D2D"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="htsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background App Rounded Tile -->
  <rect width="512" height="512" rx="112" fill="url(#htsGrad)"/>

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="185" fill="#ffffff" opacity="0.12"/>

  <!-- Phone & Cashback Graphic -->
  <g filter="url(#htsShadow)">
    <!-- Smartphone Frame -->
    <rect x="136" y="70" width="240" height="372" rx="42" fill="#0f172a" stroke="#ffffff" stroke-width="8"/>
    <rect x="154" y="96" width="204" height="320" rx="26" fill="#f8fafc"/>
    <!-- Speaker bar -->
    <rect x="226" y="82" width="60" height="6" rx="3" fill="#64748b"/>

    <!-- Screen Content: Cashback badge & coin -->
    <rect x="174" y="126" width="164" height="68" rx="14" fill="#059669"/>
    <text x="256" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">HOÀN TIỀN</text>

    <!-- Golden Coin -->
    <circle cx="256" cy="265" r="54" fill="url(#coinGrad)" stroke="#CA8A04" stroke-width="4"/>
    <text x="256" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#854D0E" text-anchor="middle">₫</text>

    <!-- Percentage and sparkles -->
    <rect x="180" y="345" width="152" height="38" rx="10" fill="#EE4D2D"/>
    <text x="256" y="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">Shopee • TikTok</text>
  </g>
</svg>
